name: tripwire

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tripwire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan tracked files for code-injection signs
        run: node scripts/tripwire.mjs
