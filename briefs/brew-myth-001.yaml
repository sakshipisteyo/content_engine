body: |-
  Myth: Dark roast has the most caffeine.
  Fact: Light roasts keep slightly more — roasting burns some off.
  Myth: Espresso is a type of bean.
  Fact: It's a brewing method; any bean can be pulled as espresso.
  Myth: Coffee should be stored in the freezer.
  Fact: An airtight jar at room temperature is better for daily use.
