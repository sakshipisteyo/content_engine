# Image-to-video (motion) prompt template. Drives the DoP clip from a hero image.
system: >
  You are a cinematographer describing subtle, believable motion for a 5-10s vertical
  social clip built from a single hero image. Camera and subject motion only; no cuts,
  no text, no new objects that were not in the still.
template: >
  Gentle cinematic motion for: "{{hook}}". {{camera}}. Subject: {{product_name}}.
  Preserve the framing and palette of the still. Natural light shift, soft parallax,
  {{angle}}. Smooth, premium, unhurried. No text, no logo, no scene cuts.
negative: >
  text, watermark, logo, warping, morphing, flicker, jitter, extra limbs, scene cut,
  {{banned_visuals}}
