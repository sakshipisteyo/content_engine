key: quote-card
name: Quote Card (text post)
description: A bold statement in the brand's own voice, laid out like a social post — name, handle, words. No photo needed.
format: image
platform: linkedin
aspect: "4:5"
mode: variants
renderer: typographic
layout: quote-card
hook_label: Your statement
hook_placeholder: "e.g. Make yourself easy to root for. Be kind. Be reliable. Celebrate other people's wins."
asks_attribution: true
default_variants: 3 # one per theme: dark, light, brand colours
default_credit_cap: 0
uses_product_image: false
copy_style: >
  The card already carries the statement — do not repeat it. Write a short caption that
  adds one line of context or a question to spark replies, then the CTA.
